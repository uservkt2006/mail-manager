name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version number (e.g., 3.6.0)'
        required: true
        default: '3.6.0'

permissions:
  contents: write
  packages: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python dependencies
        run: |
          cd backend
          python -m venv .venv
          .venv/bin/pip install -r requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Bundle backend scripts
        run: bash scripts/bundle-backend.sh

      - name: Bundle Python interpreter (Linux venv)
        run: python3 scripts/bundle-python.py

      - name: Update version in backend
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          sed -i "s/\"version\": \"3.5.8\"/\"version\": \"$VERSION\"/" backend/app.py
          sed -i "s/\"version\": \"3.6.9\"/\"version\": \"$VERSION\"/" frontend/package.json

      - name: Build Linux packages (AppImage + .deb)
        run: |
          cd frontend
          npx electron-builder --linux AppImage deb --publish never
          cd ..

      - name: Generate checksums
        run: |
          VERSION="${{ github.event.inputs.version || github.ref_name }}"
          VERSION="${VERSION#v}"
          sha256sum frontend/dist/*.AppImage frontend/dist/*.deb > checksums.txt

      - name: Upload Linux assets
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/dist/*.AppImage
            frontend/dist/*.deb
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

      - name: Bundle backend scripts
        run: bash scripts/bundle-backend.sh

      - name: Download Windows embed Python
        shell: bash
        run: |
          if [ ! -d build/python-embed-amd64 ]; then
            mkdir -p build
            curl -sL -o /tmp/python-embed.zip https://www.python.org/ftp/python/3.11.9/python-3.11.9-embed-amd64.zip
            mkdir -p build/python-embed-amd64
            unzip -q /tmp/python-embed.zip -d build/python-embed-amd64
            # Uncomment site-packages
            sed -i 's/^#import site/import site/' build/python-embed-amd64/python311._pth
            echo "Lib\\site-packages" >> build/python-embed-amd64/python311._pth
            rm /tmp/python-embed.zip
          fi
          echo "✓ Windows Python ready"

      - name: Update version in backend
        run: |
          $ver = "${{ github.event.inputs.version || github.ref_name }}".TrimStart('v')
          (Get-Content backend/app.py) -replace '3.5.8', $ver | Set-Content backend/app.py
          (Get-Content frontend/package.json) -replace '3.6.9', $ver | Set-Content frontend/package.json

      - name: Build Windows executable
        run: |
          cd frontend
          npx electron-builder --win nsis --publish never
          cd ..

      - name: Generate checksums
        run: |
          Get-ChildItem frontend/dist/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)"
          } | Out-File -FilePath checksums.txt -Encoding utf8

      - name: Upload Windows asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            frontend/dist/*.exe
            checksums.txt
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
